function validateCourseBackup(data){

 return result;
}

 {title:'골격 유무만 비교하기',before:'A: 모델X로 쉬운 과제, 지시만.\nB: 모델Y로 어려운 과제, 골격 추가.',after:'A/B: 같은 과제·같은 모델·같은 설정·같은 검사 기준.\n바꾸는 요소: 빈 골격의 유무.',steps:['모델과 과제가 함께 달라지면 골격의 영향만 분리할 수 없습니다.','조건별 반복 계획과 실행 순서를 정합니다.','원응답·조건·판정·오류·누락을 모두 남깁니다. 가장 잘 나온 응답만 고르지 않습니다.']},
 {title:'분모가 다른 두 지표',before:'응답마다 3조건. 준수 개수 A=[2,2], B=[3,1].',after:'평균 규칙 준수율: A=4/6, B=4/6 → 둘 다 약66.7%.\n완전 준수 응답 비율: A=0/2=0%, B=1/2=50%.',steps:['평균 규칙 준수율의 분모는 검사한 규칙 총수입니다.','완전 준수 비율의 분모는 응답 수입니다.','평균은 같아도, 조건을 조금씩 어긴 응답들과 모든 조건을 지킨 응답이 섞인 경우는 다릅니다. 두 번의 결과만으로 항상 그렇다고 말할 수는 없습니다.']},
 {title:'이번에는 스스로 기준 만들기',before:'새 형식에서는 무엇을 세는지부터 달라집니다. 예를 들어 목록의 번호와 본문은 서로 다른 역할입니다.',after:null,steps:['지시만 쓸지, 예시나 빈 틀을 더할지 직접 고르세요.','열·머리글·데이터 행·표 밖 문장을 각각 무엇으로 검사할지 정하세요.','원논문의 문단 개수를 그대로 가져오지 마세요. 작성 후에 검토용 해설을 열 수 있습니다.']},
 {title:'배운 방법으로 새 요청 살펴보기',before:'가능하면 이전 답안을 보지 않고 시작합니다. 막히는 부분도 학습 기록입니다.',after:null,steps:['확인할 조건을 정하고, 지시·예시·빈 틀 중 필요한 방법을 고릅니다.','검사 단위를 먼저 정하고 필요한 부분만 고칩니다.','프롬프트가 조건에 맞는지, 실제 응답이 조건을 지켰는지, 반복해서 비교했을 때 효과가 있는지를 각각 확인합니다.']}

const PRACTICE=[
 [item('d1',0,'“두 문장, 해요체”를 요구했습니다. “내일 모임을 열어요. 책을 가져와요.”를 보고 확실히 말할 수 있는 것은?', ['행사 정보까지 정확하다','제시된 두 형식 조건을 지켰다','모든 사용자가 좋아할 글이다'],1,['날짜와 준비물은 원정보와 대조해야 합니다.','두 문장과 해요체 조건은 지켰습니다. 행사 정보가 맞는지는 원래 자료와 비교해야 합니다.','형식을 지켰다고 해서 누구나 좋아할 글이라고 말할 수는 없습니다.'],'준수 여부는 명시된 조건과 응답을 대조해 판단합니다.'),

 item('e1',0,'새 요구: 제목 없이 세 문장, 합니다체. 응답은 제목 없이 세 문장의 합니다체입니다. 다음 검토에서 가장 적절한 말은?', ['형식 조건을 지켰으니 사실 확인은 끝났다','원논문의 8조건에 맞춰 네 문단으로 바꾼다','요청한 형식은 충족했고, 원정보와의 일치는 따로 확인한다'],2,['형식을 지켰다고 내용까지 사실인 것은 아닙니다.','논문의 8개 조건은 그 실험에서 쓴 기준입니다. 여기서는 새로 요청한 조건을 확인하세요.','요청한 형식은 지켰습니다. 이제 내용이 원래 정보와 맞는지 따로 확인하면 됩니다.'],'이번 요청에서 지켜야 할 조건부터 정하세요.')],
 [item('d2',1,'빈 골격 “[소개]. [신청 방법].”만 주면 전달하기 어려운 조건은?', ['두 문장 배치','해요체 사용','소개 다음 신청 방법의 순서'],1,['두 빈칸의 배치는 드러납니다.','빈 빈칸에는 말투가 나타나지 않아 별도 지시가 필요합니다.','빈칸 이름과 순서로 전달할 수 있습니다.'],'빈 틀만으로 알 수 없는 조건은 따로 써 주세요.'),
 item('p2',1,'두 문장·해요체로 짧은 안내를 요청하려 합니다. 아직 응답을 받지 않았다면 어떻게 시작할까요?', ['조건을 지시로 적어 먼저 실행하고, 결과에 따라 예시나 빈 틀이 필요한지 판단한다','논문에서 개선됐으니 모든 요청에 예시와 빈 틀을 함께 넣는다','지시만 쓰면 조건을 반드시 지키므로 검사하지 않는다'],0,['지시만으로 먼저 시도할 수 있습니다. 응답을 확인한 뒤 필요한 수정을 정하세요.','논문의 결과가 모든 요청에 예시와 빈 틀이 필요하다는 뜻은 아닙니다.','어떤 방법을 쓰더라도 실제 응답을 확인해야 합니다.'],'전달 방법은 선택이고, 효과는 실제 응답으로 확인해야 합니다.'),

 item('e3',2,'새 요구: 두 문단·각 세 문장·전체 다섯 문장. 예시를 수정하기 전에 할 일은?', ['예시를 다섯 문장으로 만든다','동시에 충족할 수 없는 요구를 확인하고 우선 조건을 정한다','해요체 예시를 합니다체로 바꾼다'],1,['각 세 문장씩 두 문단이면 여섯 문장입니다.','요구 자체의 모순을 먼저 해결해야 합니다.','지금 문제는 말투가 아닌 조건 간 모순입니다.'],'조건끼리 모순되는 경우와 예시가 지시와 다른 경우를 구분하세요.')],
 [item('d4',3,'A는 사람이 문장 수를 세고 B는 마침표 수만 셌습니다. 비교 전에 무엇이 필요할까요?', ['좋은 점수가 나온 기준만 채택','같은 문장 판정 규칙으로 두 응답을 재검토','두 점수의 평균만 계산'],1,['좋은 점수가 나오는 기준만 고르면 공정하게 비교할 수 없습니다.','두 응답의 문장 수를 같은 기준으로 세어야 비교할 수 있습니다.','다른 기준의 점수를 평균 내도 문제는 남습니다.'],'비교하는 두 조건에는 같은 검사 기준을 적용하세요.'),
 item('p4',3,'“Q. 언제 여나요? A. 내일 열어요.”에서 Q./A.를 역할 표지로 정했습니다. 본문 문장 수와 기록 방법은?', ['4문장, 기존 결과 삭제','2문장, 원판정과 보완 판정을 함께 기록','2문장, B 조건에만 새 기준 적용'],1,['역할 표지를 문장으로 센 결과와 구분해야 합니다.','이렇게 남겨 두면 어떤 기준으로 판단했고, 결과가 왜 바뀌었는지 확인할 수 있습니다.','A와 B 모두 같은 기준으로 재검토해야 합니다.'],'점수만 바꾸지 말고 판정의 근거도 남깁니다.'),
 item('e4',3,'새 응답 “가격은 3.14달러예요. 내일 판매해요.”를 마침표 기준 검사기가 세 문장으로 셌습니다. 적절한 처리는?', ['소수점을 문장 경계와 구분하고 같은 기준으로 전체 자료를 재검토','이 응답만 좋은 점수로 교체','자동 판정은 항상 정확하므로 세 문장으로 확정'],0,['경계 규칙을 고치고 원결과와 수정 결과를 분리해야 합니다.','한 응답만 예외 처리하면 비교 기준이 달라집니다.','자동 검사도 표현에 따라 오류가 생길 수 있습니다.'],'응답마다 다르게 처리하지 말고, 모든 응답에 적용할 기준을 정해 두세요.')],

</script><script>'use strict';

const stamp=()=>new Date().toISOString();
function learningState(){
 if(saved.learningV3 && saved.learningV3.version!==LEARNING_VERSION){saved.learningArchives=saved.learningArchives||[];saved.learningArchives.push(saved.learningV3);delete saved.learningV3;}
 if(!saved.learningV3){saved.learningV3={version:LEARNING_VERSION,created:stamp(),order:Math.random()<.5?['A','B']:['B','A'],lessons:{},assessments:{},exposures:[],events:[]};persist();}

}
function logLearning(type,detail={}){const s=learningState();s.events.push({at:stamp(),type,...detail});persist();}

 const s=learningState();if(!s.assessments.pre?.submitted&&!s.preDecision){s.preDecision={at:stamp(),choice:'skipped'};}
 lessonIndex=i;lessonStep=lessonRecord(i).step||0;page='course';logLearning('lesson-open',{lesson:i+1});render();focusLearning();
}
function firstCorrect(rec,q){return rec?.attempts?.[0]?.choice===q.key;}
function latestCorrect(rec,q){return rec?.attempts?.at(-1)?.choice===q.key;}
function questionMarkup(q,record,mode='learn',optionOrder=[0,1,2]){
 const attempt=record?.attempts?.at(-1);return `<fieldset class="question"><legend>${esc(q.stem)}</legend><p class="note">${mode==='learn'?'연습을 위해 만든 문제입니다.':'해설을 보지 않고, 가장 적절한 답 하나를 골라 주세요.'}</p>${optionOrder.map(k=>{const o=q.options[k];return `<label class="answer-option"><input type="radio" name="${q.id}" data-answer="${q.id}" value="${k}" ${record?.selected===k?'checked':''}><span>${esc(o)}</span></label>`}).join('')}</fieldset>${mode==='learn'?`<button class="primary" id="submit-choice">정답과 해설 확인</button>${attempt?`<section id="choice-feedback" tabindex="-1" class="feedback ${attempt.choice===q.key?'':'warning'}" role="status"><h3>${attempt.choice===q.key?'정답입니다.':'해설을 읽고 다시 풀어 보세요.'}</h3><p>${esc(q.feedback[attempt.choice])}</p><p>${esc(q.why)}</p><p class="note">처음 고른 답: ${record.attempts[0].choice===q.key?'정답':'오답'} · 총 ${record.attempts.length}회 풀이. 다시 풀어도 처음 고른 답은 따로 저장됩니다.</p></section>`:''}`:''}`;

function bindPractice(q,rec){

 $('#submit-choice').onclick=()=>{if(!Number.isInteger(rec.selected)){notify('답을 하나 골라 주세요.');return;}
 rec.attempts=rec.attempts||[];if(rec.attempts.at(-1)?.choice===rec.selected){notify('같은 답에 대한 설명은 아래에서 확인할 수 있습니다.');return;}
 rec.attempts.push({choice:rec.selected,at:stamp()});persist();renderCourse();$('#choice-feedback')?.focus();};
}
function renderCourse(){
 const s=learningState();if(lessonIndex<0){renderLearningHome();return;}
 const c=COURSE[lessonIndex],r=lessonRecord(),qs=PRACTICE[lessonIndex],q=qs[lessonStep===0?0:lessonStep===2?1:2];
 $('#main').innerHTML=`<div class="learning-shell"><div class="section-title"><button id="back-course">← 전체 과정</button><span class="save-status" id="save-state" role="status">${storageOK?'이 기기에 저장됨':'저장 제한 · 백업 필요'}</span></div><p class="eyebrow">${lessonIndex+1}차시 / 8 · 약 20분 · ${esc(c.phase)}</p><h1 id="learning-heading" tabindex="-1">${esc(c.title)}</h1><ol class="learning-steps" aria-label="차시 진행">${STEP_NAMES.map((v,i)=>`<li ${i===lessonStep?'aria-current="step"':''}>${i+1}. ${v}</li>`).join('')}</ol><p class="note">한 차시에는 약 20분이 걸립니다. 시간 제한은 없고, 중간에 멈춰도 이어서 할 수 있습니다.</p><div id="learning-body" class="card"></div><div class="lesson-nav"><button id="lesson-prev" ${lessonStep===0?'disabled':''}>이전 단계</button><span>${lessonStep+1} / 5</span><button id="lesson-next" class="primary">${lessonStep===4?'정리하고 마치기':'다음 단계 →'}</button></div></div>`;
 $('#back-course').onclick=()=>{lessonIndex=-1;renderCourse();focusLearning();};$('#lesson-prev').onclick=()=>changeStep(lessonStep-1);
 const body=$('#learning-body');
 if(lessonStep===0||lessonStep===2||lessonStep===4){const rec=r.answers[q.id]||(r.answers[q.id]={});body.innerHTML=`<span class="tag">${lessonStep===0?'설명을 읽기 전에':lessonStep===2?'답을 고르고 해설 확인하기':'배운 내용 확인하기'}</span><h2>${lessonStep===0?'설명을 읽기 전에 먼저 풀어 보세요':lessonStep===2?'답을 고른 뒤 해설을 읽어 보세요':'다른 상황에서도 풀 수 있을까요?'}</h2>${lessonStep===0&&lessonIndex===7?'<p>앞 차시를 마친 뒤 3~7일 정도 지나서 풀어 보세요. 이전 답을 보지 않고 얼마나 기억하는지 확인하는 연습입니다. 원하면 지금 바로 진행해도 됩니다.</p>':''}${questionMarkup(q,rec)}${lessonStep===4?`<label class="field" for="takeaway">다음에 AI에게 요청할 때 무엇을 확인하겠나요?</label><textarea id="takeaway" maxlength="3000" placeholder="예: 예시의 말투가 요구와 맞는지 먼저 확인하겠어요.">${esc(r.fields.takeaway||'')}</textarea><p class="note">여기서는 이번 차시에서 배운 내용을 복습합니다. 학습 전후의 변화를 비교하려면 ‘배움 확인’의 평가를 이용하세요.</p>`:''}`;
 bindPractice(q,rec);if($('#takeaway'))$('#takeaway').oninput=e=>saveLessonField('takeaway',e.target.value);
 }else if(lessonStep===1){body.innerHTML=`<span class="tag">핵심 질문</span><h2>${esc(c.question)}</h2>${c.lesson.map(t=>`<p>${esc(t)}</p>`).join('')}<div class="worked-example"><p class="note">설명을 위해 만든 예시입니다.</p><h3>${esc(WORKED[lessonIndex].title)}</h3><pre class="response">${esc(WORKED[lessonIndex].before)}</pre>${WORKED[lessonIndex].after?`<h4>검토 후</h4><pre class="response">${esc(WORKED[lessonIndex].after)}</pre>`:""}<ol>${WORKED[lessonIndex].steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div><h3>답안을 쓴 뒤 확인할 세 가지</h3><ul>${c.checks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${c.caseIndex!==null?`<details><summary>관련 실험의 실제 응답과 전체 결과 보기</summary>${courseEvidence(c.caseIndex)}</details>`:'<div class="result">이 차시에서는 논문에서 다루지 않은 형식으로 연습합니다. 이 형식에서도 같은 효과가 나타나는지는 아직 확인하지 않았습니다.</div>'}<p class="note">논문은 프롬프트에 따른 응답 차이를 연구했습니다. 이 앱으로 얼마나 배울 수 있는지는 별도로 확인해야 합니다.</p>`;
 }else renderArtifact(body,c,r);
 $('#lesson-next').onclick=()=>{
 if([0,2,4].includes(lessonStep)&&!r.answers[q.id]?.attempts?.length){notify('답을 고르고 정답과 해설을 확인해 주세요. 틀려도 다음 단계로 갈 수 있습니다.');return;}
 if(lessonStep===3&&!r.history.length){notify('초안과 검토 근거를 남기고 ‘수정 기록 저장’을 눌러 주세요.');return;}
 if(lessonStep===3&&r.dirty){notify('바꾼 답안을 먼저 저장해 주세요.');return;}
 if(lessonStep<4){changeStep(lessonStep+1);return;}
 if(!r.fields.takeaway?.trim()){notify('다음에 AI에게 요청할 때 확인할 점을 한 줄 적어 주세요.');return;}
 r.completed=stamp();r.reviewNeeded=!firstCorrect(r.answers[qs[2].id],qs[2]);persist();renderLessonSummary();focusLearning();
 };
}
function saveLessonField(k,v){const r=lessonRecord();r.fields[k]=v;if(k!=='takeaway')r.dirty=true;const ok=persist();const el=$('#save-state');if(el)el.textContent=ok?'자동 저장됨':'저장 제한 · 전체 과정에서 백업 필요';}
function renderArtifact(body,c,r){
 body.innerHTML=`<span class="tag">직접 작성하기 · 자동 채점하지 않습니다</span><h2>직접 써 보고, 조건에 맞게 고쳐 보세요</h2><div class="task-brief">${esc(c.task)}</div>${r.draftLocked?`<details><summary>처음 쓴 답안 보기</summary><pre class="response">${esc(r.firstDraft)}</pre></details>`:`<label class="field" for="artifact-draft">초안 · ${esc(c.prompts.join(' '))}</label><textarea id="artifact-draft" maxlength="12000" class="large">${esc(r.fields.draft||'')}</textarea><button id="lock-draft">초안 저장하고 검토하기</button><p class="note">먼저 스스로 답을 써 보세요. 저장한 뒤 해설을 읽고 비교할 수 있습니다. 직접 쓴 답안은 자동 채점하지 않습니다.</p>`}<div id="artifact-review" tabindex="-1"></div>`;
 if(!r.draftLocked){$('#artifact-draft').oninput=e=>saveLessonField('draft',e.target.value);$('#lock-draft').onclick=()=>{const t=r.fields.draft?.trim();if(!t){notify('초안을 먼저 작성해 주세요.');return;}r.firstDraft=t;r.draftLocked=stamp();persist();renderCourse();$('#artifact-review').focus();};return;}
 $('#artifact-review').innerHTML=`<details id="worked-solution"><summary>예시 답안과 해설</summary><p>${esc(c.example)}</p></details><label class="field" for="artifact-final">검토 후 답안</label><textarea id="artifact-final" maxlength="12000" class="large" placeholder="요구한 조건을 지키면서, 필요한 부분만 고쳐 보세요.">${esc(r.fields.final||'')}</textarea><h3>각 조건을 지킨 부분을 답안에서 찾아 적으세요</h3><p class="note">아래 조건에 해당하는 문장이나 계산을 답안에서 찾아 옮겨 적어 주세요. 실제로 조건에 맞는지는 직접 확인하거나 다른 사람에게 검토를 부탁하세요.</p>${c.checks.map((t,i)=>`<label class="field" for="evidence-${i}">${i+1}. ${esc(t)}</label><textarea id="evidence-${i}" data-evidence="${i}" maxlength="3000" placeholder="조건에 맞는 부분을 옮겨 적고, 왜 맞는지 설명해 주세요.">${esc(r.evidence[i]||'')}</textarea>`).join('')}<label class="field" for="artifact-reason">어디를 고쳤고, 왜 고쳤나요? 고치지 않았다면 그 이유를 적어 주세요.</label><textarea id="artifact-reason" maxlength="3000">${esc(r.fields.reason||'')}</textarea><button id="save-artifact" class="primary">수정 기록 저장</button><div id="artifact-message" role="status">${r.history.length?`<p>수정 기록 ${r.history.length}개 저장됨 · 답안이 맞는지는 직접 검토해 주세요.</p>`:''}</div><details><summary>추가 문제 · 선택</summary><p>${esc(c.extra)}</p></details>`;
 $('#worked-solution').ontoggle=e=>{if(e.target.open&&!r.solutionViewed){r.solutionViewed=stamp();persist();}};
 $('#artifact-final').oninput=e=>saveLessonField('final',e.target.value);$('#artifact-reason').oninput=e=>saveLessonField('reason',e.target.value);
 document.querySelectorAll('[data-evidence]').forEach(el=>el.oninput=()=>{r.evidence[Number(el.dataset.evidence)]=el.value;r.dirty=true;persist();});
 $('#save-artifact').onclick=()=>{if(!r.fields.final?.trim()||!r.fields.reason?.trim()||r.evidence.some(t=>!t.trim())){notify('고친 답안, 세 조건을 지킨 근거, 수정한 이유를 모두 적어 주세요.');return;}
 r.history.push({at:stamp(),final:r.fields.final,reason:r.fields.reason,evidence:[...r.evidence]});r.dirty=false;persist();$('#artifact-message').innerHTML='<p class="result">작성한 답안과 검토 내용을 저장했습니다. 다음 단계에서는 다른 문제를 풀어 보세요. 저장했다고 해서 정답으로 처리되지는 않습니다.</p>';};
}
function renderLessonSummary(){const c=COURSE[lessonIndex],r=lessonRecord(),qs=PRACTICE[lessonIndex];$('#main').innerHTML=`<div class="learning-shell card"><p class="eyebrow">${lessonIndex+1}차시 활동 기록</p><h1 id="learning-heading" tabindex="-1">${r.reviewNeeded?'마지막 문제를 한 번 더 살펴보세요':'이번 차시를 마쳤습니다'}</h1><p>마지막 문제에서 처음 고른 답은 ${r.reviewNeeded?'틀렸습니다. 해설을 읽고 다시 풀 수 있습니다. 처음 고른 답과 다시 푼 답은 따로 저장합니다.':'맞았습니다. 직접 작성한 답안도 조건에 맞는지 확인해 보세요. 한 문제를 맞힌 것만으로 충분히 익혔다고 판단하지는 않습니다.'}</p><div class="result"><h3>내가 기억할 점</h3><p>${esc(r.fields.takeaway)}</p></div><h3>복습할 때 기억할 점</h3><p>${esc(qs[2].why)}</p><p>오늘은 여기서 멈춰도 됩니다. 다음 차시는 다른 날 이어가 보세요. 마지막 평가에서는 해설 없이 새 과제를 풀게 됩니다.</p><div class="actions"><button id="summary-home">전체 과정</button><button id="summary-review">새 상황 문제 다시 보기</button>${lessonIndex<7?'<button id="summary-next">다음 차시 살펴보기</button>':'<button id="summary-assess" class="primary">사후 평가로 이동</button>'}</div></div>`;

function renderLearningHome(){const s=learningState(),count=Object.values(s.lessons).filter(r=>r.completed).length;$('#main').innerHTML=`<section class="hero"><div><p class="eyebrow">프롬프트 작성 연습</p><h1 id="learning-heading" tabindex="-1">AI가 조건을 놓쳤다면,<br>프롬프트부터 살펴보세요.</h1><p>문장 수나 말투를 정해 줬는데도 AI가 지키지 않았나요? 확인할 조건을 정하고, 필요한 요청 방법을 골라 응답을 검사하는 연습을 합니다. 이 과정은 글의 형식과 지시 준수에 집중합니다.</p></div><div class="hero-aside"><strong>${count}/8</strong><small>마친 차시</small></div></section><div class="card"><h2>하루 한 차시, 약 20분</h2><p>먼저 문제를 풀고, 설명을 읽은 뒤 직접 프롬프트를 작성합니다. 지시만으로 시작하는 경우와 예시·빈 틀이 필요한 경우를 비교하고, 마지막에는 자신의 작업에 적용합니다.</p><p class="note">20분은 예상 시간입니다. 작성한 답과 진행 단계는 자동 저장됩니다.</p><div class="actions"><button id="resume-learning" class="primary">${count===8?'1차시 다시 살펴보기':Object.keys(s.lessons).length?'이어서 학습':'학습 시작'}</button><button id="assess-from-home">학습 전후 평가</button></div></div>${!s.assessments.pre?.submitted?'<div class="guide"><h2>배우기 전에는 얼마나 알고 있을까요?</h2><p>배우기 전과 후를 비교하고 싶다면 사전 평가부터 풀어 보세요. 객관식 6문항과 직접 작성하는 1문항으로, 약 10~15분이 걸릴 것으로 예상합니다. 바로 학습을 시작해도 괜찮지만, 이후에 치른 평가는 학습 전 실력과 구분해야 합니다.</p><button id="baseline-start">사전 평가 먼저 하기</button></div>':''}<div class="course-grid">${COURSE.map((c,i)=>{const r=s.lessons[i];return `<button class="course-card" data-lesson="${i}"><span class="tag">${i+1}차시 · 약 20분</span><h2>${esc(c.title)}</h2><p>${esc(c.question)}</p><strong>${r?.completed?(r.reviewNeeded?'완료 · 복습 필요':'완료'):r?'진행 중 · '+STEP_NAMES[r.step||0]:'시작 전'}</strong><p class="note">${i>=6?'새로운 형식으로 연습하기 · 실제 효과는 별도 확인':esc(c.phase)}</p></button>`}).join('')}</div><section class="card"><h2>답안과 수정 과정을 저장합니다</h2><p>과제가 바뀌어 이번 과정은 새로 시작합니다. 이전 과정의 기록은 전체 백업 파일에 남아 있습니다.</p><p>처음 고른 답과 다시 푼 답, 초안과 수정 이유를 따로 저장합니다. 직접 쓴 답안은 자동 채점하지 않습니다. 얼마나 배웠는지는 새로운 문제를 풀고, 작성한 답안을 다른 사람에게 검토받아 확인해 보세요.</p><div class="actions"><button id="backup-v3">전체 기록 백업</button><label class="import-label">학습 백업 불러오기<input id="restore-v3" type="file" accept=".json,application/json"></label></div><p class="note"> function examForm(kind,s=learningState()){return kind==='delayed'?'C':s.order[kind==='pre'?0:1];}
function shuffledOptions(){const a=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function examScore(e){return e?.submitted?EXAMS[e.form].reduce((n,q)=>n+(e.answers[q.id]===q.key?1:0),0):null;}
function contamination(kind){const s=learningState();const labels=[];
 if(kind==='pre'&&(Object.keys(s.lessons).length||Object.keys(saved.course20||{}).length||Object.keys(saved.course||{}).length||Object.keys(saved.cases||{}).length||saved.draft))labels.push('학습·연습 기록 있음');
 if(kind==='pre'&&s.events.some(e=>e.type==='reference-open'))labels.push('사전 평가 전에 연구·연습 화면 열람');
 const started=s.assessments[kind]?.started;if(started&&s.events.some(e=>['reference-open','lesson-open'].includes(e.type)&&Date.parse(e.at)>=Date.parse(started)))labels.push('평가 시작 후 학습 자료 열람');
 if(s.exposures.length)labels.push('평가 해설을 미리 열었음');return labels;
}
function beginExam(kind){const s=learningState();if(s.assessments[kind]?.submitted){notify('제출한 평가 답안은 변경하지 않습니다. 결과에서 확인하세요.');return;}
 if(kind==='delayed'&&!s.assessments.post?.submitted){notify('사후 평가를 먼저 제출해 주세요.');return;}
 const e=s.assessments[kind]||(s.assessments[kind]={form:examForm(kind),started:stamp(),answers:{},artifact:'',step:0,flags:contamination(kind)});
 if(!e.optionOrders)e.optionOrders=Object.fromEntries(EXAMS[e.form].map(q=>[q.id,shuffledOptions()]));
 if(kind==='pre')s.preDecision={at:stamp(),choice:'assessment'};examView=kind;examStep=e.step||0;page='assessment';persist();render();focusLearning();
}
function renderAssessment(){if(examView){renderExam();return;}const s=learningState(),pre=s.assessments.pre,post=s.assessments.post,delayed=s.assessments.delayed;
 $('#main').innerHTML=`<div class="learning-shell"><p class="eyebrow">배움 확인 · 학습 전후 비교</p><h1 id="learning-heading" tabindex="-1">배운 내용을<br>새 문제에도 적용할 수 있을까요?</h1><p>학습 전과 후, 그리고 며칠 뒤에 새로운 문제를 풀어 보세요. 점수가 어떻게 달라졌는지 비교할 수 있습니다. 다만 그 차이가 이 앱 덕분인지는 이 기록만으로 알 수 없습니다.</p><div class="card"><h2>평가 방법</h2><p>평가마다 객관식 6문항과 직접 작성하는 1문항이 있습니다. 학습 시간과 별도로 약 10~15분을 예상해 주세요. 제출한 답안은 고칠 수 없고, 정답과 해설은 원할 때 직접 열어 볼 수 있습니다.</p><p class="note">A/B형 순서는 이 기록에서 ${s.order.join(' → ')}로 배정됐습니다. 비슷한 내용을 묻도록 만들었지만, 난이도가 같은지는 아직 확인하지 않았습니다. 각 영역에 한 문제씩만 있으므로 점수는 참고용으로 봐 주세요. C형은 며칠 뒤 다시 확인할 때 사용합니다.</p><div class="assessment-grid">${['pre','post','delayed'].map((k,i)=>{const e=s.assessments[k],disabled=k==='delayed'&&!post?.submitted;return `<section class="assessment-card"><h3>${['학습 전','과정 후','며칠 뒤'][i]}</h3><p>${['배우기 전 확인','새 요구에 적용','3~7일 뒤 권장'][i]}</p>${e?.submitted?`<strong>객관식 ${examScore(e)} / 6</strong><p>직접 쓴 답안은 별도 검토가 필요합니다.</p><p class="note">제출 ${esc(new Date(e.submitted).toLocaleDateString('ko-KR'))}</p>`:`<button data-exam="${k}" ${disabled?'disabled':''}>${e?'이어서 응시':'평가 시작'}</button>`}</section>`}).join('')}</div>${pre?.submitted&&post?.submitted?`<div class="result"><strong>객관식 변화: ${examScore(post)-examScore(pre)>0?'+':''}${examScore(post)-examScore(pre)}점 / 6점</strong><p>문제 수가 적고 평가마다 과제가 다릅니다. 문제에 익숙해졌거나 다른 곳에서 배운 내용도 점수에 영향을 줄 수 있습니다. 직접 쓴 답안이 얼마나 나아졌는지는 따로 검토해야 합니다.</p></div>`:''}${post?.submitted?`<p class="note">사후 제출 이후 ${Math.max(0,Math.floor((Date.now()-Date.parse(post.submitted))/86400000))}일 경과. 지연 평가는 3~7일 뒤를 권장하며 일찍 진행해도 실제 간격을 기록합니다.</p>`:''}</div><section class="card"><h2>결과를 볼 때 알아둘 점</h2><p>아직 실제 학습자를 대상으로 이 앱의 효과를 확인하지 않았습니다. 여기서는 그 확인에 필요한 답안과 점수를 모읍니다. 객관식 점수, 직접 쓴 답안, 며칠 뒤의 결과를 각각 살펴보세요.</p>${assessmentTable(s)}<div class="actions"><button id="export-study">평가 기록 JSON</button><button id="export-study-csv">객관식 문항별 CSV</button><button id="export-review">작성 답안·채점표</button></div><p class="note">서술 답안에 개인정보를 적지 마세요. 파일은 사용자가 직접 공유하며 앱은 전송하지 않습니다. 자기평가와 독립 평가를 구분하세요.</p></section><section class="card"><h2>해설은 언제 보는 게 좋을까요?</h2><p>며칠 뒤 평가까지 마친 다음에 해설을 보는 것을 권합니다. 먼저 해설을 열면 이후 답에 영향을 줄 수 있어, 그 사실을 기록합니다. 평가 중 다른 자료나 도움을 이용했는지도 제출할 때 알려 주세요.</p><button id="reveal-exams">제출한 평가의 답안·해설 열기</button><div id="exam-solutions"></div></section><section id="ratings-panel" class="card"></section></div>`;
 renderRatings();document.querySelectorAll('[data-exam]').forEach(el=>el.onclick=()=>beginExam(el.dataset.exam));
 $('#export-study').onclick=()=>download('prompt-lab-assessment.json',JSON.stringify(studyExport(),null,2),'application/json');
 $('#export-study-csv').onclick=()=>download('prompt-lab-assessment-items.csv','\uFEFF'+studyCSV(),'text/csv;charset=utf-8');

 $('#reveal-exams').onclick=()=>{if(!Object.values(s.assessments).some(e=>e.submitted)){notify('제출한 평가가 없습니다.');return;}if(!s.assessments.delayed?.submitted&&!confirm('지연 평가 전 해설을 열면 이후 점수가 영향을 받을 수 있습니다. 해설 노출을 기록하고 열까요?'))return;
 s.exposures.push({at:stamp(),forms:Object.values(s.assessments).filter(e=>e.submitted).map(e=>e.form)});persist();$('#exam-solutions').innerHTML=Object.entries(s.assessments).filter(([,e])=>e.submitted).map(([kind,e])=>`<h3>${{pre:'사전',post:'사후',delayed:'지연'}[kind]} · ${e.form}형</h3>${EXAMS[e.form].map(q=>`<article class="feedback"><h4>${esc(q.stem)}</h4><p>내 답: ${esc(q.options[e.answers[q.id]])}</p><p><strong>정답: ${esc(q.options[q.key])}</strong></p><p>${esc(q.why)}</p></article>`).join('')}<h4>직접 설계 답안</h4><pre class="response">${esc(e.artifact)}</pre>`).join('');};
}
function assessmentTable(s){return `<div class="tablewrap"><table><caption>항목별 결과</caption><thead><tr><th>능력</th><th>사전 첫 제출</th><th>사후 첫 제출</th><th>지연 첫 제출</th></tr></thead><tbody>${SKILLS.map((sk,i)=>`<tr><th>${sk}</th>${['pre','post','delayed'].map(k=>{const e=s.assessments[k];return `<td>${e?.submitted?(e.answers[EXAMS[e.form][i].id]===EXAMS[e.form][i].key?'일치':'재검토 필요'):'미측정'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>${Object.entries(s.assessments).filter(([,e])=>e.submitted).map(([k,e])=>`<p class="note">${{pre:'사전',post:'사후',delayed:'지연'}[k]} 해석 조건: ${esc([...e.flags,...(e.help==='yes'?['외부 도움 사용']:e.help==='unknown'?['외부 도움 불확실']:[]),...(e.kind==='post'&&e.lessonsCompleted<8?['과정 일부만 진행']:[])].join(' · ')||'기록된 참고 사항 없음 · 다른 영향까지 통제한 평가는 아닙니다.')} ${e.delayDays!==undefined?'· 사후와의 간격 '+e.delayDays.toFixed(1)+'일':''}</p>`).join('')}`;}
function renderExam(){const s=learningState(),e=s.assessments[examView],qs=EXAMS[e.form],q=qs[examStep];
 $('#main').innerHTML=`<div class="learning-shell"><div class="section-title"><button id="exit-exam">저장하고 평가 목록으로</button><span class="note">답안 자동 저장 · 제출 전 수정 가능</span></div><p class="eyebrow">${{pre:'사전',post:'사후',delayed:'지연'}[examView]} 평가 · ${e.form}형</p><h1 id="learning-heading" tabindex="-1">${examStep<6?`${examStep+1} / 6 · 판단 문제`:'직접 설계 · 마지막 과제'}</h1><div class="card">${q?questionMarkup(q,{selected:e.answers[q.id]},'exam',e.optionOrders?.[q.id]||[0,1,2]):`<div class="task-brief">${esc(PRODUCTIONS[e.form])}</div><p>지금 할 수 있는 만큼 작성하세요. 평가 중에는 학습 해설과 이전 답을 보지 않는 것을 권장합니다.</p><label class="field" for="exam-artifact">직접 작성한 답안</label><textarea id="exam-artifact" class="large" maxlength="12000">${esc(e.artifact)}</textarea><fieldset><legend>문제를 풀면서 이전 답이나 해설을 봤거나, AI나 다른 사람의 도움을 받았나요?</legend>${[['no','사용하지 않았어요'],['yes','사용했어요'],['unknown','잘 모르겠어요']].map(([v,t])=>`<label class="answer-option"><input name="exam-help" type="radio" data-help="${v}" ${e.help===v?'checked':''}>${t}</label>`).join('')}</fieldset><p class="note">직접 쓴 답안은 저장만 하고 자동으로 채점하지 않습니다. 모든 문제에 답했는지 확인한 뒤 제출해 주세요. 제출 후에는 답안을 고칠 수 없습니다.</p>`}</div><div class="lesson-nav"><button id="exam-prev" ${examStep===0?'disabled':''}>이전</button><span>${examStep+1} / 7</span><button class="primary" id="exam-next">${examStep===6?'최종 제출':'다음'}</button></div></div>`;
 $('#exit-exam').onclick=()=>{examView=null;renderAssessment();};document.querySelectorAll('[data-answer]').forEach(el=>el.onchange=()=>{e.answers[q.id]=Number(el.value);persist();});
 if($('#exam-artifact'))$('#exam-artifact').oninput=ev=>{e.artifact=ev.target.value;persist();};document.querySelectorAll('[data-help]').forEach(el=>el.onchange=()=>{e.help=el.dataset.help;persist();});
 $('#exam-prev').onclick=()=>{examStep--;e.step=examStep;persist();renderExam();focusLearning();};
 $('#exam-next').onclick=()=>{if(examStep<6){if(!Number.isInteger(e.answers[q.id])){notify('답을 하나 선택해 주세요.');return;}examStep++;e.step=examStep;persist();renderExam();focusLearning();return;}
 const error=examSubmissionError(e);if(error){notify(error);return;}if(!confirm('첫 제출 답안으로 잠급니다. 이후에는 고칠 수 없습니다. 제출할까요?'))return;
 submitExam(examView);examView=null;renderAssessment();focusLearning();};
}
function examSubmissionError(e){if(EXAMS[e.form].some(q=>!Number.isInteger(e.answers[q.id])||e.answers[q.id]<0||e.answers[q.id]>=q.options.length))return '객관식 여섯 문항에 모두 답해 주세요.';if(!e.artifact.trim())return '직접 설계 답안을 적어 주세요. 어렵다면 막힌 부분을 기록해도 됩니다.';if(!['yes','no','unknown'].includes(e.help))return '도움 사용 여부를 선택해 주세요.';return '';}
function submitExam(kind){const s=learningState(),e=s.assessments[kind];if(!e||e.submitted||examSubmissionError(e))return false;
 e.kind=kind;e.submitted=stamp();e.lessonsCompleted=Object.values(s.lessons).filter(r=>r.completed).length;e.flags=[...new Set([...e.flags,...contamination(kind)])];
 if(kind==='delayed')e.delayDays=(Date.parse(e.submitted)-Date.parse(s.assessments.post.submitted))/86400000;persist();return true;}
function studyExport(){const s=learningState();return {schema:'prompt-lab-study-1',version:LEARNING_VERSION,exported:stamp(),scope:'형식 지시 준수 판단·설계. 학습효과 미입증',order:s.order,preDecision:s.preDecision||null,assessments:s.assessments,ratings:s.ratings||[],exposures:s.exposures,lessons:s.lessons,scoring:{objectiveMax:6,artifactMax:8,artifact:'독립 검토자가 채점. 자동 점수 없음',formEquivalence:'미검증'},notes:'시작~제출 간격은 휴식 포함 경과 시간이며 활동 시간이 아닙니다. 개인 변화는 인과 효과가 아닙니다.'};}
function csvCell(v){let t=String(v??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function studyCSV(){const rows=[['version','phase','form','item','skill','answer_index','correct','started','submitted','elapsed_minutes_including_breaks','delay_days','help','flags']];Object.entries(learningState().assessments).forEach(([k,e])=>{if(!e.submitted)return;EXAMS[e.form].forEach(q=>rows.push([LEARNING_VERSION,k,e.form,q.id,SKILLS[q.skill],e.answers[q.id],e.answers[q.id]===q.key?1:0,e.started,e.submitted,((Date.parse(e.submitted)-Date.parse(e.started))/60000).toFixed(2),e.delayDays??'',e.help,e.flags.join('|')]));});return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}

function validateLearningBackup(data){

 if(!obj(v.lessons)||!obj(v.assessments)||!Array.isArray(v.order)||!['AB','BA'].includes(v.order.join(''))||!date(v.created)||!Array.isArray(v.exposures)||!Array.isArray(v.events))throw Error('백업 구조가 올바르지 않습니다.');

 for(const [id,a] of Object.entries(r.answers)){const q=PRACTICE[+i].find(q=>q.id===id);if(!q||!obj(a)||a.selected!==undefined&&(!Number.isInteger(a.selected)||a.selected<0||a.selected>2)||a.attempts!==undefined&&(!Array.isArray(a.attempts)||a.attempts.some(t=>!Number.isInteger(t.choice)||t.choice<0||t.choice>2||!date(t.at))))throw Error('판단 기록이 올바르지 않습니다.');}
 if(r.firstDraft!==undefined&&!str(r.firstDraft))throw Error('초안이 올바르지 않습니다.');if(r.draftLocked&&!date(r.draftLocked)||r.completed&&!date(r.completed)||r.solutionViewed&&!date(r.solutionViewed))throw Error('차시 시간이 올바르지 않습니다.');
 for(const h of r.history)if(!obj(h)||!date(h.at)||!str(h.final)||!str(h.reason)||!Array.isArray(h.evidence)||h.evidence.length!==3||h.evidence.some(t=>!str(t,3000)))throw Error('수정 이력이 올바르지 않습니다.');}
 for(const [k,e] of Object.entries(v.assessments)){if(!['pre','post','delayed'].includes(k)||!obj(e)||e.form!==examForm(k,v)||!obj(e.answers)||!str(e.artifact)||!date(e.started)||!Number.isInteger(e.step)||e.step<0||e.step>6||!Array.isArray(e.flags)||e.flags.some(t=>!str(t,200)))throw Error('평가 기록이 올바르지 않습니다.');
 for(const [id,a] of Object.entries(e.answers))if(!EXAMS[e.form].some(q=>q.id===id)||!Number.isInteger(a)||a<0||a>2)throw Error('평가 답안이 올바르지 않습니다.');if(e.submitted&&(!date(e.submitted)||examSubmissionError(e)))throw Error('제출된 평가가 불완전합니다.');if(e.delayDays!==undefined&&(!Number.isFinite(e.delayDays)||e.delayDays<0))throw Error('평가 간격이 올바르지 않습니다.');}

 // Keep only recognized keys; never merge untrusted prototype keys into app state.
 return JSON.parse(JSON.stringify(v),(key,value)=>['__proto__','constructor','prototype'].includes(key)?undefined:value);
}
async function restoreBackup(ev){const file=ev.target.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('백업은 5MB 이하만 불러올 수 있습니다.');const v=validateLearningBackup(JSON.parse(await file.text()));if(!confirm('현재 새 과정 기록을 백업 파일의 기록으로 교체할까요? 기존 기록을 먼저 백업하는 것이 좋습니다. 개편 전 기록은 유지합니다.'))return;saved.learningV3=v;lessonIndex=-1;examView=null;const stored=persist();renderCourse();notify(stored?'새 과정 기록을 복원했습니다.':'현재 화면에만 복원됐습니다. 저장이 제한되어 다시 백업해야 합니다.');}catch(e){notify('복원하지 않았습니다: '+e.message);}finally{ev.target.value='';}}
</script><script>'use strict';
const EXP_KEY='prompt-lab-experiments-v1';
let experiments={draft:{task:'도서관 독서 모임을 소개해 줘.',paragraphs:2,perParagraph:2,total:4,style:'요',example:'독서 모임을 열어요. 토요일에 만나요.\n\n책을 가져오세요. 댓글로 신청해 주세요.',skeleton:'[소개 문장]. [일시 문장].\n\n[준비물 문장]. [신청 문장].',reason:'',repeats:1},versions:[],runs:[]};

function experimentProblems(d){const errors=[];for(const k of ['paragraphs','perParagraph','total'])if(!Number.isInteger(d[k])||d[k]<1||d[k]>20)errors.push('문단·문장 수는 1~20 사이의 정수로 입력하세요.');if(d.paragraphs*d.perParagraph!==d.total)errors.push(`${d.paragraphs}문단 × 문단마다 ${d.perParagraph}문장은 총 ${d.paragraphs*d.perParagraph}문장입니다. 전체 문장 수와 맞춰 주세요.`);if(!d.task.trim())errors.push('과제를 작성해 주세요.');if(!d.example.trim()||!d.skeleton.trim())errors.push('비교할 예시와 빈 틀을 모두 작성해 주세요.');return errors;}
function experimentPrompts(d){const common=`${d.task}\n\n요구사항:\n- ${d.paragraphs}문단\n- 문단마다 ${d.perParagraph}문장\n- 전체 ${d.total}문장\n- ${d.style==='요'?'해요체':'합니다체'}\n- 소제목 없이 본문만 작성`;

function inspectExperimentText(text,d){
 const raw=String(text||'').trim(),blocks=raw?raw.split(/\n\s*\n/):[];

const EXP_NAMES={plain:'지시만',example:'예시 추가',skeleton:'빈 틀 추가'};
function freezeExperiment(){const d=JSON.parse(JSON.stringify(experiments.draft)),errors=experimentProblems(d);if(errors.length)return {errors};const prompts=experimentPrompts(d);if(Object.values(prompts).some(s=>s.length>12000))return {errors:['완성된 프롬프트는 조건별로 12,000자 이하여야 합니다.']};const v={id:expId(),at:expTime(),draft:d,prompts};experiments.versions.push(v);expSelected=v.id;saveExperiments();return {version:v};}

function expField(k,label,type='text'){const d=experiments.draft;return `<label class="field" for="exp-${k}">${label}</label>${type==='area'?`<textarea id="exp-${k}" maxlength="8000" data-exp="${k}" ${expBusy?'disabled':''}>${esc(d[k])}</textarea>`:`<input id="exp-${k}" type="${type}" ${type==='number'?'min="1" max="20"':''} value="${esc(d[k])}" data-exp="${k}" ${expBusy?'disabled':''}>`}`;}
function renderExperiment(){const d=experiments.draft,v=experiments.versions.find(x=>x.id===expSelected)||experiments.versions.at(-1),errors=experimentProblems(d),exampleFlags=inspectExperimentText(d.example,d);
 $('#main').innerHTML=`<section class="hero"><div><p class="eyebrow">나의 실험</p><h1>프롬프트를 바꾸면 응답도 달라질까요?</h1><p>같은 과제를 지시만 썼을 때, 예시를 넣었을 때, 빈 틀을 넣었을 때로 나눠 비교합니다. 결과는 논문 자료와 별도로 저장됩니다.</p></div></section><div class="pair"><section class="card"><h2>1. 요구사항과 비교 조건</h2>${expField('task','AI에게 맡길 과제','area')}<div class="row">${expField('paragraphs','문단 수','number')}${expField('perParagraph','문단마다 문장 수','number')}${expField('total','전체 문장 수','number')}</div><label class="field" for="exp-style">말투</label><select id="exp-style" ${expBusy?'disabled':''}><option value="요" ${d.style==='요'?'selected':''}>해요체</option><option value="합니다" ${d.style==='합니다'?'selected':''}>합니다체</option></select>${expField('example','비교에 사용할 완성 예시','area')}${expField('skeleton','비교에 사용할 빈 틀','area')}${expField('reason','이번에 바꾼 부분과 이유','area')}<button id="exp-inspect" ${expBusy?'disabled':''}>조건 확인</button><div id="exp-validation" role="status">${errors.length?`<div class="result warning">${errors.map(e=>`<p>${esc(e)}</p>`).join('')}</div>`:'<p class="result">문단 수와 문장 수에 모순이 없습니다.</p>'}<p class="note">예시 검사: ${exampleFlags.map(f=>`${f.label} ${f.pass===null?'확인 필요':f.pass?'일치':'불일치'}`).join(' · ')}. 예시의 불일치는 충돌 실험을 위해 그대로 둘 수 있습니다.</p></div><button id="exp-freeze" ${expBusy?'disabled':''}>비교안 저장</button></section><section class="card"><h2>2. API 연결과 실행</h2><p>현재 OpenAI API를 지원합니다. API 키는 서버 환경변수에만 넣습니다. 아래에는 API 키가 아닌, 본인이 정한 실험 비밀번호를 입력하세요.</p><label class="field" for="exp-token">실험 비밀번호 · 저장하지 않습니다</label><input id="exp-token" type="password" autocomplete="off" ${expBusy?'disabled':''}><button id="exp-connect" ${expBusy?'disabled':''}>연결 설정 확인 · 유료 호출 없음</button><label class="field" for="exp-model">실행 모델</label><select id="exp-model" ${expBusy?'disabled':''}>${expModels.length?expModels.map(m=>`<option ${m===expModel?'selected':''}>${esc(m)}</option>`).join(''):'<option value="">먼저 연결 설정을 확인하세요</option>'}</select><label class="field" for="exp-repeats">조건별 반복 횟수</label><select id="exp-repeats" ${expBusy?'disabled':''}>${[1,2,3].map(n=>`<option ${d.repeats===n?'selected':''}>${n}</option>`).join('')}</select><p id="exp-cost">한 번 실행하면 총 ${d.repeats*3}회 API를 호출합니다. 호출당 출력 토큰 상한은 1,200이며 요금은 모델과 사용량에 따라 달라집니다. 프롬프트는 OpenAI로 전송됩니다.</p><p>실행 순서는 무작위입니다. 과제, 조건, 모델, 출력 길이 제한은 같게 맞춥니다. 실패한 요청은 자동 재시도하지 않습니다.</p><div class="actions"><button class="primary" id="exp-run" ${expBusy?'disabled':''}>현재 비교안으로 유료 실험 실행</button><button id="exp-stop" ${!expBusy?'disabled':''}>다음 호출부터 중단</button></div><p id="exp-progress" role="status">${expBusy?'실행 중입니다. 현재 호출은 끝까지 받은 뒤 저장합니다.':'실행 전에는 비용 발생을 다시 확인합니다.'}</p><p class="note">HTML 파일을 직접 열었을 때는 API 호출을 사용할 수 없습니다. 서버로 실행하거나 Vercel에 배포해야 합니다.</p></section></div><section class="card"><h2>3. 비교안과 결과</h2><label class="field" for="exp-version">비교안 이력</label><select id="exp-version">${experiments.versions.map((x,i)=>`<option value="${x.id}" ${x.id===v?.id?'selected':''}>${i+1}번 · ${esc(new Date(x.at).toLocaleString('ko-KR'))}</option>`).join('')}</select><div id="exp-results">${v?renderExperimentResults(v):'<p>비교안을 저장하면 프롬프트와 결과를 여기에서 볼 수 있습니다.</p>'}</div></section><section class="card"><h2>응답을 직접 가져오기</h2><p>선택한 비교안으로 직접 실행한 응답도 분석할 수 있습니다. API 응답과 구분해 기록하며, 여기서 선택한 모델명은 사용자가 적은 정보입니다.</p><label for="exp-manual-condition">조건</label><select id="exp-manual-condition">${Object.entries(EXP_NAMES).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><label class="field" for="exp-manual-model">실행한 모델</label><input id="exp-manual-model" type="text" maxlength="100"><label class="field" for="exp-manual">응답 붙여넣기</label><textarea id="exp-manual" maxlength="20000"></textarea><label class="field" for="exp-import-text">또는 TXT 파일 불러오기</label><input id="exp-import-text" type="file" accept=".txt,text/plain"><button id="exp-add">선택한 비교안에 응답 저장</button></section><div class="actions"><button id="exp-export">전체 실험 백업 JSON</button><button id="exp-csv">선택한 비교안 결과 CSV</button></div><p class="note">실험 기록은 이 브라우저에 저장됩니다. 기존 학습 백업과 별도로 전체 실험 백업을 받아 주세요. 원응답·실패 기록·비교안이 함께 포함됩니다. 사실성은 자동 평가하지 않습니다.</p>`;
 bindManualDraft();
 bindExperimentExtras();
 document.querySelectorAll('[data-exp]').forEach(el=>el.oninput=()=>{d[el.dataset.exp]=el.type==='number'?Number(el.value):el.value;saveExperiments();});
 $('#exp-style').onchange=e=>{d.style=e.target.value;saveExperiments();};$('#exp-repeats').onchange=e=>{d.repeats=Number(e.target.value);saveExperiments();$('#exp-cost').textContent=`총 ${d.repeats*3}회 API 호출 · 호출당 출력 상한 1,200토큰 · 요금은 모델과 실제 사용량에 따라 달라집니다. 프롬프트를 OpenAI로 전송합니다.`;};
 $('#exp-token').value=expToken;$('#exp-token').oninput=e=>{expToken=e.target.value;};$('#exp-model').onchange=e=>expModel=e.target.value;
 $('#exp-inspect').onclick=()=>{const errors=experimentProblems(d),flags=inspectExperimentText(d.example,d);$('#exp-validation').innerHTML=(errors.length?errors.map(e=>`<p class="result warning">${esc(e)}</p>`).join(''):'<p class="result">문단 수와 문장 수에 모순이 없습니다.</p>')+`<p class="note">예시 검사: ${flags.map(f=>`${f.label} ${f.pass===null?'확인 필요':f.pass?'일치':'불일치'}`).join(' · ')}</p>`;};$('#exp-freeze').onclick=()=>{const x=freezeExperiment();if(x.errors){notify(x.errors.join(' '));return;}renderExperiment();notify('비교안을 저장했습니다. 아래 비교안 이력에서 확인할 수 있습니다.');};
 $('#exp-connect').onclick=async()=>{try{if(location.protocol==='file:')throw Error('서버 또는 배포한 주소에서 열어 주세요.');const r=await fetch('/api/experiment',{headers:{Authorization:'Bearer '+expToken}}),j=await r.json();if(!r.ok)throw Error(j.error);expModels=j.models;expModel=expModels[0];renderExperiment();notify('서버 설정을 확인했습니다. 아직 AI를 호출하지 않았습니다.');}catch(e){notify(e.message||'서버에 연결하지 못했습니다.');}};
 $('#exp-run').onclick=runExperiment;$('#exp-stop').onclick=()=>{expStop=true;$('#exp-progress').textContent='현재 호출이 끝나면 중단합니다. 이미 시작한 호출에는 비용이 발생할 수 있습니다.';};
 $('#exp-version').onchange=e=>{expSelected=e.target.value;renderExperiment();};
 $('#exp-import-text').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>60000){notify('TXT 파일은 60KB 이하여야 합니다.');return;}const t=await f.text();if(t.length>20000){notify('응답은 20,000자 이하여야 합니다.');return;}experiments.manualDraft.text=t;saveExperiments();if($('#exp-manual'))$('#exp-manual').value=t;};
 $('#exp-add').onclick=()=>{if(!v){notify('먼저 비교안을 저장하세요.');return;}const text=$('#exp-manual').value.trim(),model=$('#exp-manual-model').value.trim();if(!text||!model){notify('응답과 실행 모델을 적어 주세요.');return;}experiments.runs.push({id:expId(),version:v.id,condition:$('#exp-manual-condition').value,source:'manual',status:'completed',model,text,at:expTime(),flags:inspectExperimentText(text,v.draft)});experiments.manualDraft.text='';saveExperiments();renderExperiment();notify('응답과 검사 결과를 추가했습니다.');};
 $('#exp-export').onclick=()=>download('prompt-lab-experiments.json',JSON.stringify({schema:EXP_KEY,...experiments},null,2),'application/json');
 $('#exp-csv').onclick=()=>{if(!v){notify('비교안을 저장하세요.');return;}const rows=[['condition','source','model','status','paragraphs','per_paragraph','total','style','time'],...expResults(v).map(r=>[r.condition,r.source,r.model,r.status,...(r.flags||Array(4).fill({pass:null})).map(f=>f.pass===null?'unknown':f.pass),r.at])];download('experiment-results.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');};
}
function bindManualDraft(){const m=experiments.manualDraft;for(const [id,key] of [['exp-manual','text'],['exp-manual-model','model'],['exp-manual-condition','condition']]){const el=$('#'+id);el.value=m[key];el[el.tagName==='SELECT'?'onchange':'oninput']=()=>{m[key]=el.value;saveExperiments();};}}
function renderExperimentResults(v){const all=expResults(v),previous=experiments.versions[experiments.versions.findIndex(x=>x.id===v.id)-1];return `<p>수정 이유: ${esc(v.draft.reason||'기록하지 않음')}</p>${previous?`<details><summary>바로 이전 비교안과 달라진 부분</summary>${['task','paragraphs','perParagraph','total','style','example','skeleton'].filter(k=>previous.draft[k]!==v.draft[k]).map(k=>`<h4>${esc(({task:'과제',paragraphs:'문단 수',perParagraph:'문단별 문장 수',total:'전체 문장 수',style:'말투',example:'예시',skeleton:'빈 틀'})[k])}</h4><pre class="response">이전: ${esc(previous.draft[k])}\n현재: ${esc(v.draft[k])}</pre>`).join('')||'<p>프롬프트와 요구사항에 변경이 없습니다.</p>'}</details>`:''}${Object.entries(v.prompts).map(([k,p])=>`<details><summary>${EXP_NAMES[k]} · 실제 전송할 프롬프트</summary><pre class="response">${esc(p)}</pre></details>`).join('')}<div class="tablewrap"><table><thead><tr><th>조건</th><th>기록 / 완료</th><th>자동 검사 가능</th><th>평균 규칙 준수율</th><th>전체 조건 충족률</th></tr></thead><tbody>${expSummary(v).map(s=>`<tr><th>${EXP_NAMES[s.condition]}</th><td>${s.attempts} / ${s.complete}</td><td>${s.judged}개 · 확인 필요 ${s.unknown}개</td><td>${s.mean===null?'—':(s.mean*100).toFixed(1)+'%'}</td><td>${s.full===null?'—':(s.full*100).toFixed(1)+'%'}</td></tr>`).join('')}</tbody></table></div><p class="note">비율의 분모는 네 규칙을 모두 자동 판정할 수 있는 완료 응답입니다. 확인 필요·오류·미완료는 분모에서 제외하고 위에 따로 표시합니다. 모호한 응답이 많으면 비율이 편향될 수 있습니다. 수동 입력과 서로 다른 모델·실행 묶음이 섞이면 효과 비교에 사용하지 마세요.</p>${new Set(all.filter(r=>r.status==='completed').map(r=>r.model+'|'+r.source)).size>1?'<p class="result warning">모델 또는 수집 방식이 섞여 있습니다. 위 집계는 참고용이며 조건의 효과로 해석할 수 없습니다.</p>':''}${experimentGroups(v)}${experimentReview(all)}${all.map(r=>`<details><summary>${EXP_NAMES[r.condition]} · ${esc(r.model)} · ${esc(r.status)} · ${r.source==='api'?'API 응답':'직접 입력'}</summary><p class="note">${esc(r.at)} · 실행 묶음 ${esc(r.batch||'수동')} · ${r.usage?'토큰 '+esc(r.usage.total_tokens):'토큰 정보 없음'}</p><pre class="response">${esc(r.text||r.error||'')}</pre>${(r.flags||[]).map(f=>`<p>${f.label}: <strong>${f.pass===null?'확인 필요':f.pass?'조건 충족':'조건 위반'}</strong> · ${esc(f.detail)}</p>`).join('')}${manualReviewUI(r)}${r.status==='incomplete'?'<p>응답이 끝까지 생성되지 않았으므로 준수율 계산에 포함하지 않습니다.</p>':''}</details>`).join('')}<p class="note">빈 줄을 문단 경계, 마침표·물음표·느낌표를 문장 경계로 봅니다. 약어·복잡한 인용문은 사람이 확인해야 합니다. 말투 검사도 문장 끝 패턴을 이용한 보조 검사입니다.</p>`;}
async function runExperiment(){if(expBusy)return;if(!expToken||!expModel){notify('먼저 연결 설정을 확인하세요.');return;}const errors=experimentProblems(experiments.draft);if(errors.length){notify(errors.join(' '));return;}const n=experiments.draft.repeats*3;if(!confirm(`OpenAI에 과제·예시·빈 틀을 전송하고 총 ${n}회 유료 호출합니다. 호출당 출력 상한은 1,200토큰입니다. 실행할까요?`))return;
 const frozen=freezeExperiment();if(frozen.errors){notify(frozen.errors.join(' '));return;}const v=frozen.version,model=expModel,token=expToken,batch=expId(),jobs=[];for(let i=0;i<v.draft.repeats;i++)jobs.push(...Object.keys(EXP_NAMES));for(let i=jobs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[jobs[i],jobs[j]]=[jobs[j],jobs[i]];}
 v.plan={batch,model,order:jobs,maxOutputTokens:1200,provider:'OpenAI',started:expTime()};expBusy=true;expStop=false;saveExperiments();renderExperiment();
 try{for(let i=0;i<jobs.length&&!expStop;i++){const condition=jobs[i],record={id:expId(),version:v.id,condition,batch,source:'api',model,at:expTime(),status:'pending'};experiments.runs.push(record);saveExperiments();if(page==='experiment')$('#exp-progress').textContent=`${i+1} / ${jobs.length} · ${EXP_NAMES[condition]} 응답을 기다립니다.`;
 try{const r=await fetch('/api/experiment',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({model,prompt:v.prompts[condition]}),signal:AbortSignal.timeout(65000)}),j=await r.json();if(!r.ok)throw Error(j.error||'API 요청 실패');Object.assign(record,j);if(j.status==='completed')record.flags=inspectExperimentText(j.text,v.draft);}catch(e){record.status='error';record.error=e.message||'요청 실패';expStop=true;}saveExperiments();}
 }finally{v.plan.finished=expTime();v.plan.stopped=expStop;expBusy=false;saveExperiments();if(page==='experiment')renderExperiment();notify('실험 기록을 저장했습니다. 실패·중단한 요청은 자동 재실행하지 않습니다.');}}

function experimentReview(rows){const notes=[];if(rows.some(r=>r.flags?.slice(0,3).some(f=>f.pass===false)))notes.push('문단·문장 수를 놓친 응답이 있습니다. 2차시에서 빈 틀을 만드는 방법을 복습해 보세요.');if(rows.some(r=>r.flags?.[3]?.pass===false))notes.push('말투 조건을 어긴 응답이 있습니다. 3차시에서 지시와 예시의 말투가 맞는지 확인해 보세요.');if(rows.some(r=>r.flags?.some(f=>f.pass===null)))notes.push('자동으로 판단하기 어려운 응답이 있습니다. 4차시의 검사 기준을 참고해 직접 확인해 보세요.');return notes.length?'<div class="result"><h3>결과에 따른 복습 추천</h3>'+notes.map(t=>'<p>'+t+'</p>').join('')+'<small>자동 검사에 따른 안내이며 학습 성적은 아닙니다.</small></div>':'';}

function experimentGroups(v){
 const groups=new Map();for(const r of expResults(v)){const key=JSON.stringify([r.model,r.source,r.batch||'수동 입력']);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);}
 return `<details><summary>모델·실행 회차별 비교</summary><p>자동 판정만 집계합니다. 서로 다른 묶음의 차이를 프롬프트 효과로 단정하지 마세요. 수동 입력은 실행 회차 정보가 없습니다.</p>${[...groups].map(([key,runs])=>`<h3>${JSON.parse(key).map(esc).join(' · ')}</h3><div class="tablewrap"><table><tr><th>조건</th><th>전체 / 판정 가능</th><th>평균 규칙 준수</th></tr>${Object.entries(EXP_NAMES).map(([k,n])=>{const a=runs.filter(r=>r.condition===k),b=a.filter(r=>r.status==='completed'&&r.flags?.length===4&&r.flags.every(f=>f.pass!==null));return `<tr><th>${n}</th><td>${a.length} / ${b.length}</td><td>${b.length?(100*b.reduce((n,r)=>n+r.flags.filter(f=>f.pass).length,0)/(4*b.length)).toFixed(1)+'%':'—'}</td></tr>`;}).join('')}</table></div>`).join('')}</details>`;
}
function manualReviewUI(r){if(r.status!=='completed'||!r.flags)return '';return `<fieldset data-review="${esc(r.id)}"><legend>사람이 다시 검토하기</legend><p>자동 판정과 집계는 유지합니다. 검토 결과는 별도 이력으로 남습니다.</p>${r.flags.map((f,i)=>`<label>${esc(f.label)} <select data-flag="${i}"><option value="unknown">확인 필요</option><option value="true">조건 충족</option><option value="false">조건 위반</option></select></label>`).join('')}<label>판단 근거<textarea data-review-reason maxlength="2000"></textarea></label><button data-review-save>검토 기록 저장</button>${(r.reviews||[]).map(x=>`<p>${esc(x.at)} · ${x.flags.map(f=>f===null?'확인 필요':f?'충족':'위반').join(' / ')}<br>${esc(x.reason)}</p>`).join('')}</fieldset>`;}

function analyze(text,original=false){

 };

 const strip=s=>s.replace(/[.!?'")\]\s]+$/g,'');
 const flags=[headers===4,blocks.length===4,!!blocks[0]&&blocks[0].length===2,(raw.match(/!/g)||[]).length===1,blocks.length>0&&blocks.every(b=>b.length>=2&&b.length<=4),sentences.length>=10&&sentences.length<=14,sentences.length>0&&sentences.every(s=>strip(s).endsWith('요')),!!sentences[0]&&Array.from(sentences[0]).length<=20];

 `<div class="onboard-flow"><div><b>요청</b><span>‘잘 써 줘’를 넘어, 반드시 지켜야 할 조건이 분명한가?</span></div><div><b>방법 선택</b><span>지시만으로 시작할까? 예시나 빈 틀이 더 필요한가?</span></div><div><b>결과</b><span>실제로 조건을 지켰는가? 문장이 자연스러운 것만 보고 넘어가지 않았는가?</span></div></div><div class="practice-card"><strong>앞의 요청을 정리하면</strong><p>“첫 문장은 일시와 장소, 둘째 문장은 준비물을 알려 줘. 총 두 문장, 모두 해요체로 써 줘.”</p><p><strong>필요하다면 이런 빈 틀을 줄 수 있어요.</strong></p><div class="response">[일시·장소를 알리는 문장].<br>[준비물을 알리는 문장].</div></div><p>완성 예시를 더 붙이는 것만이 방법은 아닙니다. <strong>지시만 쓸지, 빈 틀이나 예시를 더할지</strong> 목적에 맞게 선택하고 결과를 확인하는 법을 배웁니다.</p>`,
 `<p><strong>총 8차시</strong> 동안 응답을 비교하고, 직접 프롬프트를 쓰고 고칩니다.</p><div class="onboard-flow"><div><b>1–2차시</b><span>확인할 조건을 정하고, 지시·예시·빈 틀 중 필요한 방법을 고릅니다.</span></div><div><b>3–4차시</b><span>조건의 모순이나 예시의 충돌을 찾고, 같은 기준으로 응답을 검사합니다.</span></div><div><b>5–6차시</b><span>빈 틀의 효과를 비교하는 실험을 짜고, 모델마다 결과가 다른지 살펴봅니다.</span></div><div><b>7–8차시</b><span>새 과제의 프롬프트를 직접 쓰고, 며칠 뒤 다시 풀어 봅니다.</span></div></div><p>각 차시에서 <strong>초안 쓰기 → 해설과 비교하기 → 고치고 이유 적기</strong>를 남깁니다. 설명을 읽은 뒤 무엇을 바꾸었는지까지 확인합니다.</p><p class="note">논문은 예시·골격·충돌·모델 차이의 근거를 제공합니다. 새 과제와 교육 과정은 그 결과를 바탕으로 설계한 학습 활동입니다.</p>`,
 `<div class="onboard-flow"><div><b>이전</b><span>“원하는 답이 아니네. 다시 잘 써 달라고 해야겠다.”</span></div><div><b>배운 뒤의 목표</b><span>“두 문장이라는 조건을 놓쳤네. 빈 틀을 더한 뒤 같은 조건으로 비교해 보자.”</span></div></div><p>기대하는 변화는 <strong>어긴 조건을 찾고, 프롬프트를 고친 뒤 결과를 확인하는 습관</strong>입니다. 반복해서 부탁하는 부담을 줄이는 데 도움이 되는지는 실제 작업에서 확인해야 합니다.</p><p class="note">이 앱으로 실력이 얼마나 늘거나 시간이 얼마나 줄어드는지는 아직 확인하지 않았습니다. ‘나의 실험’에서 실제 응답을 받아 고친 프롬프트의 효과를 비교할 수 있습니다. API 실행에는 별도 비용이 듭니다.</p><div class="practice-card"><h3>오늘은 1차시부터 시작하세요.</h3><p>먼저 짧은 안내문의 조건 위반을 판단하고 직접 고쳐 봅니다. 배우기 전 실력을 확인하려면 과정 화면에서 사전 평가부터 시작하세요. 여러 날에 나누어 이어가도 됩니다.</p><p class="note">차시당 목표 약 20분 · 추가 탐구는 선택 · 답안 자동 저장 · 과정 화면에서 백업 가능<br>상단 ‘처음 사용 안내’에서 언제든 이 이야기를 다시 볼 수 있습니다.</p></div>`
 ];
 $('#onboard-content').innerHTML=`<div class="onboard-top"><span class="eyebrow">왜 이걸 배우나요? · ${onboardStep+1} / ${panels.length}</span><button id="onboard-skip">안내 닫기</button></div><div class="onboard-progress" aria-hidden="true">${panels.map((_,i)=>`<span class="${i<=onboardStep?'filled':''}"></span>`).join('')}</div><h2 id="onboard-title" tabindex="-1">${titles[onboardStep]}</h2>${panels[onboardStep]}<div class="onboard-actions">${onboardStep?'<button id="onboard-prev">이전</button>':'<span></span>'}<button id="onboard-next" class="primary">${nextLabels[onboardStep]}</button></div>`;
 $('#onboard-skip').onclick=closeOnboarding;
 if(onboardStep)$('#onboard-prev').onclick=()=>{onboardStep--;drawOnboarding();$('#onboarding').scrollTop=0;$('#onboard-title').focus();};
 $('#onboard-next').onclick=()=>{if(onboardStep===panels.length-1){closeOnboarding();go('course');return;}onboardStep++;drawOnboarding();$('#onboarding').scrollTop=0;$('#onboard-title').focus();};
 if(onboardStep===0)$('#onboard-reveal').onclick=()=>{onboardAnswer=true;drawOnboarding();$('#onboard-reveal').focus();};
}
$('#help').onclick=openOnboarding;
$('#onboarding').addEventListener('cancel',e=>{e.preventDefault();closeOnboarding();});
if(saved.onboardingVersion!==3)openOnboarding();
</script></body></html>
